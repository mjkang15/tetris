<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <a href="landing.html" class="back-link">← 소개 페이지</a>
    <h1 class="title">TETRIS</h1>
    <div class="game-area">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="sidebar">
        <div class="stat-block">
          <span class="stat-label">NEXT</span>
          <canvas id="next" width="100" height="100"></canvas>
        </div>
        <div class="stat-block">
          <span class="stat-label">SCORE</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">LEVEL</span>
          <span class="stat-value" id="level">1</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">LINES</span>
          <span class="stat-value" id="lines">0</span>
        </div>
        <div class="controls">
          <p class="controls-title">조작키</p>
          <ul>
            <li><kbd>←</kbd> <kbd>→</kbd> 이동</li>
            <li><kbd>↓</kbd> 소프트 드롭</li>
            <li><kbd>↑</kbd> 회전</li>
            <li><kbd>Space</kbd> 하드 드롭</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="mobile-controls">
    <div class="btn-row">
      <button class="ctrl-btn" id="btn-left" aria-label="왼쪽 이동">◀</button>
      <button class="ctrl-btn" id="btn-rotate" aria-label="회전">↻</button>
      <button class="ctrl-btn" id="btn-right" aria-label="오른쪽 이동">▶</button>
    </div>
    <div class="btn-row">
      <button class="ctrl-btn" id="btn-down" aria-label="소프트 드롭">▼</button>
      <button class="ctrl-btn" id="btn-hard" aria-label="하드 드롭">⬇</button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-box">
      <p id="overlay-title">GAME OVER</p>
      <p id="overlay-score"></p>
      <button id="restart-btn">다시 시작</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
